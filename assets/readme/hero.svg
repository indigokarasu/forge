<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Forge</title>
  <desc id="desc">Forge — skill architect and builder. A six-phase pipeline designs, scopes, builds, and validates agent skills before a single file is written.</desc>
  <defs>
    <radialGradient id="bg" cx="0.26" cy="0.34" r="0.9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15101F"/>
      <stop offset="0.55" stop-color="#0C0F16"/>
      <stop offset="1" stop-color="#0B0E11"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="980" cy="150" r="220" fill="#7C5CFF" opacity="0.06"/>
  <text x="64" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="800" letter-spacing="-1" fill="#F4F6FB">Forge</text>
  <rect x="66" y="126" width="64" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#C7CEDB">Skill architect and builder —</text>
  <text x="64" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#C7CEDB">a six-phase pipeline.</text>
  <line x1="700" y1="210" x2="1150" y2="210" stroke="#7C5CFF" stroke-width="2" opacity="0.4"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#AEB6C6" text-anchor="middle">
    <circle cx="700" cy="210" r="18" fill="#0E111A" stroke="url(#accent)" stroke-width="2"/><text x="700" y="214" fill="#F4F6FB">P1</text><text x="700" y="250">design</text>
    <circle cx="790" cy="210" r="18" fill="#0E111A" stroke="url(#accent)" stroke-width="2"/><text x="790" y="214" fill="#F4F6FB">P2</text><text x="790" y="250">scope</text>
    <circle cx="880" cy="210" r="18" fill="#0E111A" stroke="url(#accent)" stroke-width="2"/><text x="880" y="214" fill="#F4F6FB">P3</text><text x="880" y="250">build</text>
    <circle cx="970" cy="210" r="18" fill="#0E111A" stroke="url(#accent)" stroke-width="2"/><text x="970" y="214" fill="#F4F6FB">P4</text><text x="970" y="250">test</text>
    <circle cx="1060" cy="210" r="18" fill="#0E111A" stroke="url(#accent)" stroke-width="2"/><text x="1060" y="214" fill="#F4F6FB">P5</text><text x="1060" y="250">validate</text>
    <circle cx="1150" cy="210" r="20" fill="#7C5CFF"/><text x="1150" y="214" fill="#0B0E11">P6</text><text x="1150" y="250">ship</text>
  </g>
  <text x="700" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#8A93A6" letter-spacing="2">DESIGN BEFORE CODE — NOT A PLAN, A BUILT SKILL.</text>
</svg>
